name: Runtime compatibility
on:
    pull_request:
        branches: [main]
        paths:
            - packages/runtime/**
            - packages/mips
            - packages/risc-v
            - packages/x86
            - .github/workflows/runtime-compatibility.yml
    push:
        branches: [main]
        paths:
            - packages/runtime/**
            - packages/mips
            - packages/risc-v
            - packages/x86
            - .github/workflows/runtime-compatibility.yml

concurrency:
    group: runtime-compatibility-${{ github.ref }}
    cancel-in-progress: true

jobs:
    compatibility:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: ./.github/actions/setup-workspace
            - uses: actions/cache@v4
              with:
                  path: packages/runtime/.cache
                  key: runtime-probes-${{ hashFiles('packages/runtime/**', '!packages/runtime/node_modules/**') }}
                  restore-keys: runtime-probes-
            # Each task below builds the Cores it runs on first.
            - name: Check ABI guard and generated library inputs
              run: |
                  pnpm exec vp run @asm-editor/runtime#test
                  pnpm exec vp run @asm-editor/runtime#generate:check
                  git diff --exit-code -- packages/runtime/abi/signatures.cpp packages/runtime/generated/v1
            - name: Run frozen assembly against the current library
              run: pnpm exec vp run @asm-editor/runtime#test:cores --abi-fixtures
            - name: Install native test compilers
              run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
            - name: Compare the native runtime with glibc
              run: pnpm exec vp run @asm-editor/runtime#test:native
