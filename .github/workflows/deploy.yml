name: Deploy
# Every push: main is the production deployment, any other branch a preview at
# <branch>.asm-editor.pages.dev. Cloudflare's own builds cannot make them, as its build image has no
# JDK or Rust for the Cores, so its automatic deployments are off and the project takes uploads.
on:
    push:
        branches:
            - '**'

# A newer push to a branch makes its in-flight preview redundant; production deploys run to the end.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        name: Deploy
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: ./.github/actions/setup-workspace
            # The search model and the index's vectors (ADR 0026): the model by its pinned
            # revision, the vectors from the newest run, since only changed text is embedded again.
            - name: Cache the search model
              uses: actions/cache@v4
              with:
                  path: packages/asm-editor/.cache/search-model
                  key: search-model-${{ hashFiles('packages/asm-editor/src/lib/search/searchModel.json') }}
            - name: Cache the search vectors
              uses: actions/cache@v4
              with:
                  path: packages/asm-editor/.cache/search-vectors
                  key: search-vectors-${{ github.sha }}
                  restore-keys: search-vectors-
            # Builds the Cores from their checkouts, then the editor into ./build.
            - name: Build
              run: pnpm build
            - name: Publish
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CF_PAGES_TOKEN }}
                  accountId: ${{ secrets.CF_ACCOUNT_ID }}
                  command: pages deploy ./build/ --project-name=asm-editor --branch=${{ github.ref_name }}
