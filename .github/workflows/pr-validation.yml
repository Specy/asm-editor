name: PR Validation
on:
    pull_request:
        branches:
            - main

# A newer push to the same PR makes the in-flight run redundant.
concurrency:
    group: pr-validation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: Lint, format & test
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.6.0
                  cache: npm
            # The search model and the index's vectors (ADR 0026): the model by its pinned
            # revision, the vectors from the newest run, since only changed text is embedded again.
            - name: Cache the search model
              uses: actions/cache@v4
              with:
                  path: .cache/search-model
                  key: search-model-${{ hashFiles('src/lib/search/searchModel.json') }}
            - name: Cache the search vectors
              uses: actions/cache@v4
              with:
                  path: .cache/search-vectors
                  key: search-vectors-${{ github.sha }}
                  restore-keys: search-vectors-
            - name: Install
              run: npm i
            - name: Lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Test
              run: npm test
