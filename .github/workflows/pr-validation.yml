name: PR Validation
on:
    pull_request:
        branches:
            - main

# A newer push to the same PR makes the in-flight run redundant.
concurrency:
    group: pr-validation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: Lint, format & test
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.6.0
                  cache: npm
            - name: Install
              run: npm i
            - name: Lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Test
              run: npm test
