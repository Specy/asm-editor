name: Set up the workspace
description: The toolchains of mise.toml and the pnpm install, after a checkout with submodules.
inputs:
    tools:
        description: The mise.toml tools to install, separated by spaces; empty installs all of them.
        default: 'node pnpm'
    task-cache:
        description: Restore and save Vite Task's cache, for jobs that build the Cores.
        default: 'false'
runs:
    using: composite
    steps:
        # Node and pnpm everywhere; the JDK, Maven, Rust and wasm-pack only where the Cores build.
        # The versions are mise.toml's, as `mise install` sets them up locally.
        - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
          with:
              # Pinned like the action; it checks the download against mise's signed checksums.
              version: 2026.10.2
              install_args: ${{ inputs.tools }}
        - id: pnpm-store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        - uses: actions/cache@v6
          with:
              path: ${{ steps.pnpm-store.outputs.path }}
              key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
              restore-keys: pnpm-store-${{ runner.os }}-
        - shell: bash
          run: pnpm install --frozen-lockfile
        # Vite Task fingerprints every task itself, so the key only needs to be unique per run;
        # a Core whose sources did not change restores its `dist` instead of building again.
        - if: inputs.task-cache == 'true'
          uses: actions/cache@v6
          with:
              path: node_modules/.vite/task-cache
              key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
              restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
